<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24292F"/>
      <stop offset="100%" stop-color="#0F1419"/>
    </linearGradient>
    <filter id="shadowGh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Shape: Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGh)" filter="url(#shadowGh)"/>
  
  <!-- Outer Shield Crest -->
  <path d="M32 10 L50 18 C50 34 38 46 32 50 C26 46 14 34 14 18 Z" fill="#1B1F24" stroke="#57606A" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- GitHub Code Branch / Brackets Motif -->
  <!-- Left Angle Bracket < -->
  <path d="M26 22 L20 28 L26 34" fill="none" stroke="#58A6FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Angle Bracket > -->
  <path d="M38 22 L44 28 L38 34" fill="none" stroke="#58A6FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center Slash / Branch Node -->
  <line x1="34" y1="20" x2="30" y2="36" stroke="#3FB950" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Environment Badge Pill: GH -->
  <rect x="17" y="41" width="30" height="15" rx="7.5" fill="#0D1117" stroke="#58A6FF" stroke-width="1.5"/>
  <text x="32" y="52" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1">GH</text>
</svg>
